<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Contact Delivery Test | Prowire Electric</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main>
    <section class="section">
      <div class="section-heading is-visible">
        <p class="eyebrow">Temporary Test Route</p>
        <h1>Test contact delivery</h1>
        <p>This test sends through the same browser-based delivery method as the live contact forms, but delivers to erictatch@gmail.com.</p>
      </div>
      <form class="contact-form is-visible" action="https://formsubmit.co/ajax/erictatch@gmail.com" method="post" data-contact-form>
        <label class="form-trap" aria-hidden="true">
          <span>Company</span>
          <input type="text" name="_honey" tabindex="-1" autocomplete="off">
        </label>
        <input type="hidden" name="_subject" value="Prowire contact delivery test">
        <input type="hidden" name="_template" value="table">
        <label>
          <span>First Name</span>
          <input type="text" name="firstName" value="Eric" required>
        </label>
        <label>
          <span>Last Name</span>
          <input type="text" name="lastName" value="Test">
        </label>
        <label class="full-field">
          <span>Email</span>
          <input type="email" name="email" value="erictatch@gmail.com" required>
        </label>
        <label class="full-field">
          <span>Project Type</span>
          <select name="projectType" data-project-type required>
            <option selected>Test submission</option>
          </select>
        </label>
        <label class="full-field">
          <span>Message</span>
          <textarea name="message" rows="5" required>Testing the Prowire contact form delivery.</textarea>
        </label>
        <button class="button button-primary full-field" type="submit">Send test</button>
        <p class="form-status full-field" data-form-status aria-live="polite"></p>
      </form>
    </section>
  </main>
</body>
</html>
