<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin | Prowire Electric</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=31">
  <script src="admin.js?v=1" defer></script>
</head>
<body>
  <header class="site-header solid-header" data-header>
    <a class="brand" href="index.html" aria-label="Prowire Electric home">
      <img class="brand-logo" src="assets/logo.png" alt="" width="177" height="153">
    </a>
    <a class="header-call" href="index.html">Public Site</a>
  </header>

  <main class="admin-main">
    <section class="section admin-shell">
      <div class="admin-card reveal">
        <p class="eyebrow">Admin</p>
        <h1>Prowire Admin</h1>
        <p class="admin-status" data-admin-status>Checking access...</p>

        <div class="admin-auth" data-admin-auth hidden>
          <div class="google-button-slot" data-google-signin></div>
        </div>

        <div class="admin-panel" data-admin-panel hidden>
          <div class="admin-toolbar">
            <p>Signed in as <strong data-admin-email></strong></p>
            <button class="button button-ghost" type="button" data-admin-logout>Sign out</button>
          </div>

          <div class="admin-grid">
            <article class="admin-tool-card">
              <span>Images</span>
              <h2>Project Photos</h2>
              <p>Image editing controls will live here once storage is connected.</p>
            </article>
            <article class="admin-tool-card">
              <span>Access</span>
              <h2>Protected</h2>
              <p>This panel only renders after the server validates the admin cookie.</p>
            </article>
          </div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
